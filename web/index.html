<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0a0e19;--fg:#fff;--accent:#ffd23f;--cyan:#38e8ff;--glass:rgba(14,19,36,.78);--line:rgba(255,255,255,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e19;--fg:#fff}}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0}canvas{display:block}
#siren{position:absolute;inset:0;pointer-events:none;z-index:7;opacity:0;transition:opacity .25s;background:linear-gradient(90deg,rgba(255,30,60,.5),transparent 32%,transparent 68%,rgba(50,100,255,.5));animation:sirenA .5s steps(1) infinite}
@keyframes sirenA{50%{transform:scaleX(-1)}}
.sub0{font-size:14px;opacity:.85;margin-top:2px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42));z-index:1}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;margin:0}
.pe{pointer-events:auto}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;text-align:center;z-index:3}
.ov .top,.ov .bot{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.ovc{justify-content:center;gap:14px;background:rgba(5,8,16,.6);z-index:6}
.logo{font-weight:900;font-style:italic;line-height:.95;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.logo b{display:block;font-size:48px;letter-spacing:3px;background:linear-gradient(180deg,#fff6b0,#ffa400);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3d00)}
.logo span{font-size:22px;color:var(--cyan);letter-spacing:7px}
.pw{display:inline-flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:800;backdrop-filter:blur(8px);pointer-events:auto}
.btn{pointer-events:auto;border-radius:999px;padding:13px 28px;font-weight:900;font-size:18px;letter-spacing:.5px;background:linear-gradient(180deg,#ffe066,#ffb020);color:#2a1a00;box-shadow:0 5px 0 #b26a00,0 10px 22px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b26a00}
.btn.big{font-size:26px;padding:15px 64px}
.btn.sec{background:linear-gradient(180deg,#5af0ff,#18b6d6);color:#032;box-shadow:0 5px 0 #0a7388,0 10px 22px rgba(0,0,0,.4)}
.btn.red{background:linear-gradient(180deg,#ff8383,#e03a4a);color:#fff;box-shadow:0 5px 0 #8f1a28,0 10px 22px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn.off{filter:grayscale(.85) brightness(.75)}
.btn.sm{padding:9px 16px;font-size:14px;box-shadow:0 3px 0 #b26a00}
.csel{display:flex;align-items:center;gap:10px}
.csel button{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:24px;font-weight:900}
.cname{min-width:160px;padding:8px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px)}
.cname b{display:block;font-size:22px;letter-spacing:1px}.cname small{opacity:.75;font-size:12px}
#chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.chip{padding:7px 12px;border-radius:999px;background:var(--glass);border:1.5px dashed var(--line);font-weight:800;font-size:13px}
.chip.on{border:1.5px solid var(--accent);background:rgba(255,210,63,.2);color:var(--accent)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:420px}
.tile{position:relative;pointer-events:auto;border-radius:16px;padding:9px 2px;background:var(--glass);border:1px solid var(--line);font-weight:800;font-size:10.5px;backdrop-filter:blur(8px)}
.tile i{display:block;font-size:24px;font-style:normal;margin-bottom:1px}
.dot2{position:absolute;top:6px;right:8px;width:11px;height:11px;border-radius:50%;background:#ff3b5c;box-shadow:0 0 8px #ff3b5c;text-decoration:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:3}
#htop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hp{padding:6px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-weight:900;font-size:19px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px)}
.hr{display:flex;align-items:center;gap:6px}
#hmap{flex:1;max-width:140px;flex-direction:column;gap:0;font-size:12px;text-align:center;padding:5px 10px}#hmap b{font-size:12px;letter-spacing:.5px}
.pbar{height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden;width:100%}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b46bff,#38e8ff)}
#pausebtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:15px}
#pw{position:absolute;top:calc(62px + env(safe-area-inset-top,0px));left:12px;display:flex;flex-direction:column;gap:5px}
.pwc{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:15px;font-weight:800;min-width:110px}
.pwc .pbar{flex:1;margin:0;min-width:34px}.pwc u{text-decoration:none;font-size:11px;opacity:.85;min-width:22px;text-align:right}
.card0{pointer-events:auto;width:min(92%,380px);background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:20px 18px;backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;align-items:center}
.tt{font-size:30px;font-weight:900;letter-spacing:2px}
#res{font-size:58px;font-weight:900;color:var(--accent);line-height:1;text-shadow:0 4px 0 #7a4a00}
.lbl{font-size:12px;letter-spacing:3px;opacity:.7;margin-top:-6px}
#newrec{padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,#ff7a00,#ffd23f);color:#2a1a00;font-weight:900;font-size:13px}
#resd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
#resd div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 2px;font-size:11px;opacity:.95}#resd b{display:block;font-size:17px}
.row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 30px #000;z-index:9;pointer-events:none}
#hvn{position:absolute;top:calc(150px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-16px) scale(.88);opacity:0;pointer-events:none;z-index:21;white-space:nowrap;padding:10px 22px;border-radius:20px;text-align:center;background:linear-gradient(135deg,rgba(7,44,58,.96),rgba(10,14,26,.96));border:1.5px solid var(--cyan);box-shadow:0 0 26px rgba(56,232,255,.4),0 10px 30px rgba(0,0,0,.5);transition:opacity .3s,transform .4s cubic-bezier(.2,1.5,.4,1)}
#hvn.show{opacity:1;transform:translate(-50%,0) scale(1)}
#hvn.empty{border-color:#ff5a6e;box-shadow:0 0 26px rgba(255,90,110,.4),0 10px 30px rgba(0,0,0,.5)}
#hvn b{display:block;font-size:15px}
#hvn .n{font-size:34px;font-weight:900;line-height:1.1;color:var(--accent);text-shadow:0 0 14px rgba(255,210,63,.6)}
#hvn.empty .n{color:#ff8a98;text-shadow:none}
#hvn small{display:block;opacity:.8;font-size:12px}
/* hoverboard shop cards: special animation */
.hvc{overflow:hidden}
.hvc .ico img{animation:hvFloat 2.8s ease-in-out infinite;filter:drop-shadow(0 8px 10px color-mix(in srgb,var(--rc) 75%,transparent))}
.hvc:nth-child(2n) .ico img{animation-delay:-1s}.hvc:nth-child(3n) .ico img{animation-delay:-1.9s}
.hvc .ico{animation:hvGlow 2.8s ease-in-out infinite}
.hvc::after{content:'';position:absolute;top:0;left:-70%;width:38%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.24),transparent);transform:skewX(-20deg);animation:hvSheen 3.6s ease-in-out infinite}
.hvc:nth-child(2n)::after{animation-delay:-1.2s}.hvc:nth-child(3n)::after{animation-delay:-2.3s}
.hvc.sel .ico img{animation-duration:1.8s}
@keyframes hvFloat{0%,100%{transform:translateY(3px) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes hvGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes hvSheen{0%,55%{left:-70%}100%{left:140%}}
@media (prefers-reduced-motion:reduce){.hvc .ico img,.hvc .ico,.hvc::after{animation:none}}
#toast{position:absolute;top:calc(112px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(10,14,26,.9);border:1px solid var(--line);padding:9px 18px;border-radius:999px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;font-size:14px}
#flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#b46bff);opacity:0;pointer-events:none;z-index:7}
#panel{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end}
#menu.shopopen .top,#menu.shopopen .bot{visibility:hidden}
#panel.full{background:rgba(5,8,16,.72);backdrop-filter:blur(4px)}
#phead{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:2}
#phead .back{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:26px;font-weight:900;line-height:1}
#ptitle{flex:1;font-size:21px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 8px #000}
#pbox{position:relative;display:flex;flex-direction:column;height:62%;background:linear-gradient(180deg,rgba(22,30,56,.97),rgba(8,11,22,.99));border-radius:26px 26px 0 0;border-top:1px solid var(--line);box-shadow:0 -14px 40px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;width:100%;max-width:520px;align-self:center}
#panel.full #pbox{height:88%}
#panel.brd #pbox,#panel.low #pbox{height:46%}
#ptabs{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 6px;touch-action:pan-x;scrollbar-width:none;flex:none}#ptabs:empty{display:none}
#ptabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,#ffe066,#ffb020);color:#2a1a00;border-color:transparent}
#pbody{flex:1;overflow-y:auto;padding:8px 12px 14px;touch-action:pan-y;text-align:left;-webkit-overflow-scrolling:touch}
#pfoot{flex:none;padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;background:rgba(0,0,0,.25)}#pfoot:empty{display:none}
.fn b{display:block;font-size:17px}.fn small{opacity:.7;font-size:12px}
.sec2{margin:14px 2px 6px;font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:900;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card2{position:relative;border-radius:18px;padding:10px 10px 12px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1.5px solid color-mix(in srgb,var(--rc) 45%,transparent);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:transform .1s}
.card2:active{transform:scale(.97)}
.card2.sel{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc),0 8px 26px color-mix(in srgb,var(--rc) 35%,transparent)}
.rar{position:absolute;top:8px;left:8px;font-size:9px;font-weight:900;letter-spacing:.8px;padding:2px 7px;border-radius:999px;color:#10131f;text-transform:uppercase}
.ico{height:74px;display:grid;place-items:center;font-size:40px;border-radius:14px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 72%)}
.pal{display:flex;gap:4px;justify-content:center}.pal i{width:14px;height:14px;border-radius:50%;border:1px solid #fff5}
.ico img{height:100%;width:auto;max-width:100%;object-fit:contain;pointer-events:none}.ico:has(img){height:132px}
.mx{position:relative;display:inline-block;line-height:1}.mx b{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:max(.44em,11px);font-weight:900;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;letter-spacing:-.5px;line-height:1;pointer-events:none}.pwc .mx{font-size:24px}
.card2 b{font-size:15px}.card2 small{opacity:.7;font-size:11px;min-height:26px;line-height:1.2}
.st{margin-top:4px}.price{display:inline-block;padding:4px 12px;border-radius:999px;background:linear-gradient(180deg,#ffe066,#ffb020);color:#2a1a00;font-weight:900;font-size:13px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:800;font-size:11px}.tag.eq{background:#1fa95b;color:#fff}
.bd{display:block;width:62px;height:16px;border-radius:8px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 8px 0 -3px #222}
.li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin-bottom:8px}
.li .m{flex:1;min-width:0}.li .m b{font-size:15px}.li small{opacity:.72;display:block;font-size:12px}
.li .ti{font-size:28px;width:40px;text-align:center}
.li.sel{border-color:var(--accent);background:rgba(255,210,63,.1)}.li.done{opacity:.6}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:linear-gradient(90deg,#ffe066,#ffb020)}
.li .pbar{margin-top:6px;width:100%}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:3px;gap:2px}.seg button{flex:1;padding:8px 4px;border-radius:10px;background:none;font-weight:800;font-size:13px}.seg button.on{background:linear-gradient(180deg,#5af0ff,#18b6d6);color:#032}
.sw{flex:none;width:50px;height:29px;border-radius:15px;background:rgba(255,255,255,.18);position:relative;transition:background .15s}.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:#27c26a}.sw.on::after{left:24px}
input[type=range]{accent-color:#ffb020;width:150px}
.eqz{display:flex;gap:3px;align-items:flex-end;height:20px}.eqz i{width:4px;background:var(--cyan);border-radius:2px;animation:eqz .8s infinite ease-in-out}.eqz i:nth-child(2){animation-delay:.2s}.eqz i:nth-child(3){animation-delay:.4s}
@keyframes eqz{0%,100%{height:5px}50%{height:20px}}
.rank{width:34px;text-align:center;font-weight:900;font-size:18px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{position:relative;border-radius:14px;padding:10px 2px;text-align:center;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px}.day small{opacity:.7;display:block}.day .ico2{font-size:26px;margin:4px 0}
.day.today{border-color:var(--accent);box-shadow:0 0 18px rgba(255,210,63,.45);background:rgba(255,210,63,.1)}.day.done{opacity:.5}.day em{position:absolute;top:4px;right:6px;font-style:normal;color:#27c26a}
.note{opacity:.65;font-size:12px;text-align:center;margin:10px 0}
/* ---- v3 ---- */
.wheelw{position:relative;width:min(74vw,270px);aspect-ratio:1;max-width:100%;margin:18px auto 10px}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #ffd23f;box-shadow:0 0 0 4px #7a4a00,0 0 34px rgba(255,210,63,.5);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wl{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.wl span{margin-top:7%;text-align:center;font-weight:900;font-size:13px;line-height:1.1;text-shadow:0 1px 3px #000}.wl span i{display:block;font-style:normal;font-size:23px}
.wptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid #fff;filter:drop-shadow(0 2px 3px #000);z-index:2}
.whub{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffa400);border:3px solid #7a4a00;display:grid;place-items:center;font-size:22px;z-index:1}
.li.col{align-items:flex-start}.li.col .m b{font-size:16px}.li.col .tag{margin-left:2px}
.slots{display:flex;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.slots i{width:36px;height:42px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:21px;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.28);opacity:.45}
.slots i.on{opacity:1;border:1.5px solid #ffd23f;background:linear-gradient(180deg,#ffe066,#ffb020);color:#2a1a00;box-shadow:0 0 12px rgba(255,210,63,.45)}
.slots i.g:not(.on){filter:grayscale(1)}.slots i.g.on{background:rgba(255,255,255,.12);color:#fff}
.bk{display:block;width:100%;box-sizing:border-box;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;color:#fff;font:11px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:8px;resize:none;user-select:text;-webkit-user-select:text;touch-action:pan-y}
#bonusb{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top,0px));padding:6px 12px;border-radius:14px;background:linear-gradient(180deg,#ffe066,#ffb020);color:#2a1a00;font-weight:900;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:bpulse .6s infinite alternate}
@keyframes bpulse{to{transform:scale(1.06)}}
#hsov{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,#4a1f8f 0%,#1a0b3d 55%,#07040f 100%);pointer-events:auto;animation:hsin .35s ease-out}
@keyframes hsin{from{opacity:0}}
.hsrays{position:absolute;left:50%;top:38%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;background:repeating-conic-gradient(rgba(255,210,63,.2) 0 7deg,transparent 7deg 18deg);animation:hsrot 24s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 34%);mask-image:radial-gradient(circle,#000 0,transparent 34%)}
@keyframes hsrot{to{transform:rotate(360deg)}}
#hsc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hsbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);text-align:center}
.hscrown{font-size:62px;line-height:1;animation:hsdrop .8s cubic-bezier(.2,1.4,.4,1) both,hsfloat 2s .8s ease-in-out infinite}
@keyframes hsdrop{from{transform:translateY(-140px) scale(.3);opacity:0}}
@keyframes hsfloat{50%{transform:translateY(-6px) rotate(-5deg)}}
.hst{font-size:34px;font-weight:900;font-style:italic;letter-spacing:2px;background:linear-gradient(100deg,#fff6b0 20%,#ffa400 40%,#fff6b0 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a3d00);animation:hspop .6s .25s cubic-bezier(.2,1.5,.4,1) both,hsshine 2.2s linear infinite}

@media (max-height:640px){.hsav,.hsav img{height:130px}.hscrown{font-size:42px}.hst{font-size:28px}.hsn{font-size:50px}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){$('menu').innerHTML='<h1>The 3D engine failed to load. Check your internet connection.</h1>';throw new Error('no three');}
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){$('menu').innerHTML='<h1>WebGL is not supported on this device.</h1>';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$('game').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,1,0.1,400);
let baseFov=60;function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=baseFov=w/h<0.8?74:60;camera.updateProjectionMatrix();}
resize();addEventListener('resize',resize);

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:.05},o||{}));
const _mc={};const MC=(c,o)=>{const k=c+'|'+JSON.stringify(o||{});return _mc[k]||(_mc[k]=M(c,o));}; // obstacle ke readonly materials reuse
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- environment ----------
const FOGC=0xf2a272;
scene.fog=new THREE.Fog(FOGC,40,150);
scene.background=tex(2,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#27346b');g.addColorStop(.55,'#e8805a');g.addColorStop(1,'#ffc98a');x.fillStyle=g;x.fillRect(0,0,w,h);});
const HEMI=new THREE.HemisphereLight(0xffe0c0,0x445566,.75);scene.add(HEMI);
const sun=new THREE.DirectionalLight(0xffd9a0,1);sun.position.set(-8,16,8);sun.target.position.set(0,0,-10);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:22,bottom:-22,near:1,far:60});
scene.add(sun,sun.target);

const LANE=2.6;
const roadTex=tex(512,512,(x,w,h)=>{
  x.fillStyle='#5a554f';x.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){x.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${Math.random()*.15})`;x.fillRect(Math.random()*w,Math.random()*h,2,2);}
  const pu=w/8.6;
  for(let l=-1;l<=1;l++){const cx=w/2+l*LANE*pu;
    for(let i=0;i<8;i++){x.fillStyle='#4a3524';x.fillRect(cx-1.1*pu,i*64+8,2.2*pu,14);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(cx-1.1*pu,i*64+22,2.2*pu,4);}
    for(const s of[-.72,.72]){x.fillStyle='#8d949e';x.fillRect(cx+s*pu-3,0,6,h);x.fillStyle='#d5dae0';x.fillRect(cx+s*pu-3,0,2,h);}}
});
roadTex.wrapS=roadTex.wrapT=THREE.RepeatWrapping;roadTex.repeat.set(1,50);
const road=new THREE.Mesh(new THREE.PlaneGeometry(8.6,400),new THREE.MeshStandardMaterial({map:roadTex,roughness:1}));
road.rotation.x=-Math.PI/2;road.position.z=-150;road.receiveShadow=true;scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,500),M(0x2a2f38,{roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.03,-150);ground.receiveShadow=true;scene.add(ground);
for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(.4,1.3,420),M(0x8a8f96));w.position.set(s*5.2,.65,-150);w.castShadow=w.receiveShadow=true;scene.add(w);(window.WALLS=window.WALLS||[]).push(w);}
const bTex=tex(128,256,(x,w,h)=>{x.fillStyle='#2b3347';x.fillRect(0,0,w,h);for(let r=0;r<16;r++)for(let c=0;c<6;c++){x.fillStyle=Math.random()<.4?'#ffd98a':'#3a4460';x.fillRect(8+c*20,8+r*15,12,9);}});
const bMats=[0xffffff,0xd8c0ff,0xffd0b0].map(c=>new THREE.MeshStandardMaterial({map:bTex,color:c,roughness:.9}));
const blds=[],NB=16,SP=26;
for(const s of[-1,1])for(let i=0;i<NB;i++){const h=rnd(14,40),b=new THREE.Mesh(new THREE.BoxGeometry(rnd(8,12),h,18),bMats[i%3]);
  b.position.set(s*rnd(9,14),h/2,-i*SP+20);scene.add(b);blds.push(b);}

// ---------- zones / maps + mystery gate ----------
const THEMES={
 yard:{k:'yard',name:'Train Yard',fog:0xf2a272,sky:['#27346b','#e8805a','#ffc98a'],ground:0x2a2f38,sun:0xffd9a0,hemi:[0xffe0c0,0x445566],walls:true,bpm:150,rs:0},
 highway:{k:'highway',name:'Highway',fog:0xbcdcf2,sky:['#3d7fd1','#8cc4f0','#dff1ff'],ground:0x3a3d42,sun:0xfff4d8,hemi:[0xdff0ff,0x667788],walls:true,bpm:165,rs:3},
 forest:{k:'forest',name:'Forest',fog:0x9fc9a6,sky:['#2f6b4f','#8fcf9f','#d8f0c8'],ground:0x2f5d2c,sun:0xfff0c0,hemi:[0xd8f5d0,0x2a4a2a],walls:false,bpm:135,rs:-2},
 desert:{k:'desert',name:'Desert',fog:0xf0c58a,sky:['#d9662b','#f3a95c','#fbe0a4'],ground:0xd6b06a,sun:0xffe0a0,hemi:[0xfff0d0,0x9c7a4a],walls:false,bpm:140,rs:5}};
let TH=THEMES.yard,ST=THEMES.yard,nextGate=500,gatePend=false,gates=[];
function bgTex(a){return tex(2,256,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,a[0]);g.addColorStop(.55,a[1]);g.addColorStop(1,a[2]);x.fillStyle=g;x.fillRect(0,0,w,h);});}
function mkRoad(f){const t=tex(512,512,f);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,50);return t;}
const grain=(x,w,h,n,c)=>{for(let i=0;i<n;i++){x.fillStyle='rgba('+(Math.random()<.5?'0,0,0':c)+','+Math.random()*.14+')';x.fillRect(Math.random()*w,Math.random()*h,2,2);}};
const ROADS={yard:roadTex,
 highway:mkRoad((x,w,h)=>{const pu=w/8.6;x.fillStyle='#43464c';x.fillRect(0,0,w,h);grain(x,w,h,5000,'255,255,255');
  for(const l of[-1,0,1]){x.fillStyle='rgba(0,0,0,.14)';x.fillRect(w/2+l*LANE*pu-.7*pu,0,.4*pu,h);x.fillRect(w/2+l*LANE*pu+.3*pu,0,.4*pu,h);}
  x.fillStyle='#fff';for(const l of[-.5,.5])x.fillRect(w/2+l*LANE*pu-3,30,6,200);x.fillStyle='#f5c518';x.fillRect(4,0,6,h);x.fillRect(w-10,0,6,h);}),
 forest:mkRoad((x,w,h)=>{const pu=w/8.6;x.fillStyle='#6b4f33';x.fillRect(0,0,w,h);grain(x,w,h,6000,'200,160,100');
  for(const l of[-1,0,1]){x.fillStyle='rgba(30,15,5,.25)';x.fillRect(w/2+l*LANE*pu-.7*pu,0,.4*pu,h);x.fillRect(w/2+l*LANE*pu+.3*pu,0,.4*pu,h);}
  for(let i=0;i<120;i++){x.fillStyle=['#c0783a','#a35a24','#d9a441'][i%3];x.fillRect(Math.random()*w,Math.random()*h,5,3);}
  x.fillStyle='#3f7a37';x.fillRect(0,0,.3*pu,h);x.fillRect(w-.3*pu,0,.3*pu,h);}),
 desert:mkRoad((x,w,h)=>{const pu=w/8.6;x.fillStyle='#d9b26f';x.fillRect(0,0,w,h);grain(x,w,h,6000,'255,240,200');
  for(let i=0;i<30;i++){const y=Math.random()*h;x.strokeStyle='rgba(150,100,40,.18)';x.lineWidth=2;x.beginPath();x.moveTo(0,y);x.bezierCurveTo(w*.3,y-10,w*.6,y+10,w,y);x.stroke();}
  for(const l of[-1,0,1]){x.fillStyle='rgba(120,80,30,.2)';x.fillRect(w/2+l*LANE*pu-.7*pu,0,.4*pu,h);x.fillRect(w/2+l*LANE*pu+.3*pu,0,.4*pu,h);}})};
// scenery pools (one visible per zone)
const GROUPS={},RING=440;
function mkGroup(k,n,build){const g=new THREE.Group();for(let s=-1;s<=1;s+=2)for(let i=0;i<n;i++){const o=build(s,i);o.position.z=-i*(RING/n)+20+rnd(-3,3);g.add(o);}g.visible=false;GROUPS[k]=g;}
function moveScenery(d){if(TH.k==='rain'&&window.RAINFN)window.RAINFN();const g=GROUPS[TH.k];if(!g)return;for(const o of g.children){o.position.z+=d;if(o.position.z>45)o.position.z-=RING;}}
const trunkM=M(0x5a3d22),pineM=[M(0x1f6b34),M(0x2a8040),M(0x18552a)];
mkGroup('forest',20,(s,i)=>{const g=new THREE.Group(),h=rnd(6,10),t=new THREE.Mesh(new THREE.CylinderGeometry(.28,.38,h*.4,6),trunkM);t.position.y=h*.2;g.add(t);
  for(let j=0;j<3;j++){const c=new THREE.Mesh(new THREE.ConeGeometry(2.3-j*.55,h*.45,8),pineM[(i+j)%3]);c.position.y=h*.35+j*h*.2;g.add(c);}g.position.x=s*rnd(6.5,17);return g;});
const poleM=M(0x888d94,{metalness:.5});
mkGroup('highway',14,(s,i)=>{const g=new THREE.Group();
  if(i%2===0){const p=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,6.5,8),poleM);p.position.y=3.25;g.add(p);const a=new THREE.Mesh(new THREE.BoxGeometry(1.6,.12,.2),poleM);a.position.set(-s*.8,6.5,0);g.add(a);const l=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,.3),new THREE.MeshBasicMaterial({color:0xfff2b0}));l.position.set(-s*1.5,6.42,0);g.add(l);g.position.x=s*5.7;}
  else{const h=rnd(18,55),b=new THREE.Mesh(new THREE.BoxGeometry(rnd(8,13),h,14),bMats[i%3]);b.position.y=h/2;g.add(b);g.position.x=s*rnd(13,22);}
  return g;});
const sandM=M(0xd2a35c,{roughness:1}),sandD=M(0xb98343,{roughness:1}),cacM=M(0x3f8f4a);
mkGroup('desert',15,(s,i)=>{const g=new THREE.Group(),r=i%3;
  if(r===0){const h=rnd(6,14),rt=rnd(3,4.5),m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rt+rnd(1,2.5),h,7),sandD);m.position.y=h/2;g.add(m);const tp=new THREE.Mesh(new THREE.CylinderGeometry(rt+.4,rt,1.6,7),sandM);tp.position.y=h+.7;g.add(tp);g.position.x=s*rnd(14,26);}
  else if(r===1){const h=rnd(2.5,4.5),c=new THREE.Mesh(new THREE.CylinderGeometry(.3,.35,h,8),cacM);c.position.y=h/2;g.add(c);for(const a of[-1,1]){const arm=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,1.3,8),cacM);arm.position.set(a*.65,h*.6,0);g.add(arm);const up=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,1,8),cacM);up.position.set(a*.65,h*.6+.8,0);g.add(up);const j=new THREE.Mesh(new THREE.BoxGeometry(.7,.36,.36),cacM);j.position.set(a*.32,h*.45,0);g.add(j);}g.position.x=s*rnd(7,12);}
  else{const d=new THREE.Mesh(new THREE.SphereGeometry(3,10,6),sandM);d.scale.set(2.5,.5,2);g.add(d);g.position.x=s*rnd(9,20);}
  return g;});
// ---------- extra maps: snow, neon city, beach, lava ----------
THEMES.snow={k:'snow',name:'Snow Land',fog:0xdbe8f5,sky:['#5b86c4','#b9d4ee','#f0f6fc'],ground:0xf2f6fa,sun:0xffffff,hemi:[0xeaf2ff,0x8aa0b8],walls:false,bpm:130,rs:-5};
THEMES.neon={k:'neon',name:'Neon Night City',fog:0x1a1038,sky:['#05031a','#2a0a4a','#ff2d95'],ground:0x0c0a18,sun:0x9a7bff,hemi:[0x6a5cff,0x1a1030],walls:false,bpm:170,rs:7};
THEMES.beach={k:'beach',name:'Beach',fog:0xbfe9f5,sky:['#1ea0e0','#7fd3f0','#fdf2c8'],ground:0xf0dca0,sun:0xfff4d0,hemi:[0xffffff,0xc8b078],walls:false,bpm:125,rs:2};
THEMES.lava={k:'lava',name:'Lava Land',fog:0x3a0f08,sky:['#1a0505','#7a1c08','#ff6a1a'],ground:0x1c1210,sun:0xff8a50,hemi:[0xff7a40,0x2a0f08],walls:false,bpm:145,rs:-7};
ROADS.snow=mkRoad((x,w,h)=>{const pu=w/8.6;x.fillStyle='#eef3f8';x.fillRect(0,0,w,h);grain(x,w,h,5000,'150,175,205');
  for(const l of[-1,0,1])for(const s of[-.72,.72]){x.fillStyle='rgba(120,140,165,.35)';x.fillRect(w/2+(l*LANE+s)*pu-6,0,12,h);}
  x.fillStyle='#d6e2ef';x.fillRect(0,0,.3*pu,h);x.fillRect(w-.3*pu,0,.3*pu,h);});
ROADS.neon=mkRoad((x,w,h)=>{const pu=w/8.6;x.fillStyle='#0d0b1a';x.fillRect(0,0,w,h);grain(x,w,h,3000,'120,90,255');
  x.fillStyle='rgba(120,90,255,.18)';for(let y=0;y<h;y+=64)x.fillRect(0,y,w,2);
  x.fillStyle='#38e8ff';for(const l of[-.5,.5])x.fillRect(w/2+l*LANE*pu-3,30,6,200);
  x.fillStyle='rgba(255,45,149,.35)';x.fillRect(0,0,16,h);x.fillRect(w-16,0,16,h);x.fillStyle='#ff2d95';x.fillRect(4,0,7,h);x.fillRect(w-11,0,7,h);});
ROADS.beach=mkRoad((x,w,h)=>{const pu=w/8.6,c=['#a67c52','#b8895a','#9a6f45','#c19462'];
  for(let y=0;y<h;y+=32){x.fillStyle=c[(y/32)%4|0];x.fillRect(0,y,w,29);x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,y+29,w,3);x.fillStyle='rgba(60,35,15,.6)';x.fillRect(10,y+12,4,4);x.fillRect(w-14,y+12,4,4);}
  grain(x,w,h,3000,'255,230,180');x.fillStyle='#f0dca0';x.fillRect(0,0,.3*pu,h);x.fillRect(w-.3*pu,0,.3*pu,h);});
ROADS.lava=mkRoad((x,w,h)=>{const pu=w/8.6;x.fillStyle='#2a1c18';x.fillRect(0,0,w,h);grain(x,w,h,6000,'255,120,40');
  for(let i=0;i<40;i++){x.strokeStyle='rgba(255,'+(90+Math.random()*80|0)+',20,.9)';x.lineWidth=2+Math.random()*2;x.beginPath();let px0=Math.random()*w,py0=Math.random()*h;x.moveTo(px0,py0);for(let j=0;j<3;j++){px0+=(Math.random()-.5)*60;py0+=Math.random()*50;x.lineTo(px0,py0);}x.stroke();}
  x.fillStyle='#ff6a1a';x.fillRect(0,0,.25*pu,h);x.fillRect(w-.25*pu,0,.25*pu,h);});
// static (non-recycled) pieces per zone
const STATIC=[];window.STATIC=STATIC;
function addStatic(k,m){m.visible=false;scene.add(m);STATIC.push({k,m});}

let AC,master,musicG,sfxG,musicOn=true,sfxOn=true,musicVol=.5,sfxVol=1,mstep=0,mnext=0,combo=0,comboT=0,nbuf;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{try{AC=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'});}catch(_){AC=new(window.AudioContext||window.webkitAudioContext)();}master=AC.createGain();master.gain.value=.6;
   {const lm=AC.createDynamicsCompressor();lm.threshold.value=-14;lm.knee.value=10;lm.ratio.value=14;lm.attack.value=.003;lm.release.value=.18;master.connect(lm);lm.connect(AC.destination);} // limiter: awaazein ek saath chadhne par fatti nahi
   musicG=AC.createGain();musicG.gain.value=musicOn?musicVol:0;musicG.connect(master);sfxG=AC.createGain();sfxG.gain.value=sfxOn?sfxVol:0;sfxG.connect(master);
   mnext=AC.currentTime+.1;setInterval(musicSched,50);}catch(e){AC=null;}
}
function tone(f,d,type,v,f2,t0,dest){if(!AC)return;t0=t0||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v||.15,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(dest||sfxG);o.start(t0);o.stop(t0+d+.03);}
function noise(d,v,fq,t0,dest,type){if(!AC)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  t0=t0||AC.currentTime;const s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fq||2000;const g=AC.createGain();g.gain.setValueAtTime(v||.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t0);s.stop(t0+d+.02);}
function sfx(n){if(!AC||!sfxOn)return;const t=AC.currentTime;
  if(n==='jump')tone(260,.18,'sine',.25,620);
  else if(n==='slide')noise(.3,.25,1200,t,null,'bandpass');
  else if(n==='lane')noise(.08,.12,3000,t,null,'highpass');
  else if(n==='bump'){noise(.25,.35,500);tone(140,.22,'square',.22,70);}
  else if(n==='crash'){noise(.7,.5,600);tone(160,.6,'sawtooth',.3,30);}
  else if(n==='horn'){tone(196,.7,'sawtooth',.06);tone(247,.7,'sawtooth',.06);}
  else if(n==='power'){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.12,0,t+i*.06));}
  else if(n==='board'){[392,523,784].forEach((f,i)=>tone(f,.15,'triangle',.2,0,t+i*.05));}
  else if(n==='break'){noise(.4,.4,1800);tone(300,.3,'square',.15,60);}
  else if(n==='jet'){noise(.8,.3,900,t,null,'bandpass');tone(120,.8,'sawtooth',.12,400);}
  else if(n==='end')tone(600,.25,'sine',.15,200);
  else if(n==='bark')dogBarkSfx(dogVar);
  else if(n==='gate'){noise(.9,.35,1500,t,null,'bandpass');[261,329,392,523,659,784].forEach((f,i)=>tone(f,.25,'sine',.15,0,t+i*.07));}}

function kick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(musicG);o.start(t);o.stop(t+.2);}
function musicSched(){if(!AC||AC.state!=='running'||!musicOn)return;const T=TRACKS[SAVE.set.track]||TRACKS[1];if(T.off)return;if(mnext<AC.currentTime)mnext=AC.currentTime+.05;
  const bpm=T.bpm+((TH.bpm||140)-140)*.25,sd=60/bpm/4,fr=(sm,o)=>110*Math.pow(2,sm/12)*o;
  while(mnext<AC.currentTime+.25){let t=mnext;const s=mstep%16,bar=Math.floor(mstep/16)%4,root=T.prog[bar]+(TH.rs||0);
    if(T.swing&&s%2===1)t+=sd*T.swing;
    if(T.k[s]==='1')kick(t,T.kv);
    if(T.sn[s]==='1')noise(.12,T.sv,1800,t,musicG,'bandpass');
    if(T.h[s]==='1')noise(.04,T.hv,7000,t,musicG,'highpass');
    if(T.crackle&&Math.random()<.35)noise(.02,.03,5000,t,musicG,'highpass');
    const b=T.bass[s];if(b!==null&&b!==undefined)tone(fr(root+b,1),T.bd,T.bw,T.bv,0,t,musicG);
    if(T.pad&&s===0)for(const iv of T.ch[bar])tone(fr(root+iv,2),sd*15,T.pw,T.pad,0,t,musicG);
    const ln=T.lead==='rand'?(Math.random()<.2?T.rp[Math.floor(Math.random()*T.rp.length)]:null):T.lead[mstep%T.lead.length];
    if(ln!==null&&ln!==undefined)tone(fr(root+ln,T.lo),T.ld,T.lw,T.lv,0,t,musicG);
    mnext+=sd;mstep++;}}

function makeAbilityFx(h,c){const N=c.n,g=h.g,fx=new THREE.Group();g.add(fx);const ex=[],put=o=>{fx.add(o);return o;};let an=null;

      if(!noE&&(m==='run'||m==='jump')&&Math.random()<(E?.9:.5))fxE(g.position.x+rnd(-.12,.12),g.position.y+.1,.3,rnd(-.4,.4),rnd(0,.6),0,E?(Math.random()<.5?0x38e8ff:0xff9f1a):(Math.random()<.5?0xffd23f:0xff5a3a),.4);};}

  else if(N==='Scorpio'){
    const sT=brTex('star',64,64,(x,w,h)=>{x.translate(32,32);x.fillStyle='#ffe14d';x.beginPath();for(let i=0;i<10;i++){const r=i%2?10:26,a=i*Math.PI/5-Math.PI/2;x.lineTo(Math.cos(a)*r,Math.sin(a)*r);}x.closePath();x.fill();x.strokeStyle='#fff6b0';x.lineWidth=3;x.stroke();});

    const sting=mkSpr(0xff3030,.5);sting.position.set(0,1.75,.06);put(sting);
    an=(t,m,sp,dt,noE)=>{stars.forEach((s,i)=>{const a=t*2.4+i*2.094;s.position.set(Math.cos(a)*.42,1.84+Math.sin(t*3+i)*.07,Math.sin(a)*.42);s.material.rotation=t*2+i;});

  else if(N==='Magnus'){
    const rs=[0,1].map(i=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.5,.014,6,36),new THREE.MeshBasicMaterial({color:i?0x3b82ff:0xff3b3b,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending}));r.rotation.x=Math.PI/2;r.position.y=1.25;put(r);return r;});
    const gl=mkSpr(0xff5a5a,.5);gl.position.set(0,1.3,-.22);put(gl);
    an=(t,m,sp,dt,noE)=>{rs.forEach((r,i)=>{const k=(t*.9+i*.5)%1;r.scale.set(.5+k*1.4,.5+k*1.4,1);r.material.opacity=(1-k)*.55;});
      gl.material.color.setHex(Math.floor(t*3)%2?0x3b82ff:0xff3b3b);gl.scale.setScalar(.42+.1*Math.sin(t*8));
      if(!noE&&Math.random()<.4){const a=rnd(0,6.28),r=rnd(.8,1.2),px=Math.cos(a)*r,pz=Math.sin(a)*r,py=rnd(.4,1.9);fxE(g.position.x+px,g.position.y+py,pz,-px*2.4,(1.3-py)*1.2+3,-pz*2.4,Math.random()<.5?0xff5a5a:0x5a9aff,.5);}};}

    const aura=mkSpr(0xff6b9d,2.4,.25);aura.position.set(0,1.3,.3);put(aura);

      if(!noE&&Math.random()<.3)fxE(g.position.x+rnd(-.5,.5),g.position.y+rnd(.8,1.9),rnd(-.4,.4),0,rnd(.4,1.2),0,0xffd23f,.5);};}

  // Jumpo (super jump shoes): jootoon par glowing rings, spring jaisa bounce, jump/landing par squash-stretch

    const pads=[-.11,.11].map(x=>{const s=mkSpr(0xa55eea,.6,0);s.position.set(x,.1,-.05);put(s);return s;});let land=0;
    an=(t,m,sp,dt,noE,o)=>{const pl=.55+.35*Math.sin(t*8);rg.forEach((r,i)=>{r.material.opacity=pl;r.position.y=-.4+Math.sin(t*6+i)*.03;});
      if(m==='jump'&&o.prev!=='jump'&&!noE)spark(g.position.x,g.position.y+.1,0,0xb084ff,14);

function makeLightFx(h,c){const N=c.n,g=h.g,E=h.eyes||[],ho=h.ho||{},fx=new THREE.Group();g.add(fx);const o={t:0,prev:'idle',ph:0,off:Math.random()*3};let notes=null,glow=null;

  if(N==='Rex'){glow=mkSpr(0xff7043,.6,.3);glow.position.set(0,1.98,0);fx.add(glow);}
  h.fxAn=(t,m,sp,noE)=>{const dt=Math.min(.05,Math.max(0,t-o.t));o.t=t;if(m==='run')o.ph+=dt*(sp||0)*.55;
    const show=m!=='fall';fx.visible=show;h.up.scale.set(1,1,1);h.up.rotation.z=0;
    if(!show){o.prev=m;return;}
    const idle=m==='idle',run=m==='run',tt=t+o.off;
    E.forEach(e=>e.scale.y=(tt%3.4)<.12?.1:1);                         // palak jhapakna
    if(idle)h.up.scale.set(1,1+Math.sin(t*2)*.012,1);                  // saans lena
    if(ho.bag){ho.bag.position.y=.3+(run?Math.abs(Math.cos(o.ph))*.045:0);ho.bag.rotation.x=run?Math.sin(o.ph)*.06:0;}   // bag uchalna
    if(ho.tail){h.up.rotation.z=idle?Math.sin(t*1.7)*.035:0;ho.tail.rotation.z=run?Math.sin(o.ph)*.35:Math.sin(t*2.2)*.12;ho.tail.rotation.x=-.5-(run?.12*Math.abs(Math.sin(o.ph)):0);}  // ponytail jhoolna
    if(N==='Rocky'&&idle&&!noE){const w=tt%5;if(w<1.4){const k=Math.min(1,w/.25,(1.4-w)/.25),s=Math.sin(w*13);h.aR.rotation.x=0;h.aR.rotation.z=(2.5+s*.22)*k;h.eR.rotation.x=.2+(.5+s*.35)*k;}}   // haath hilana

    if(N==='Kai'){if(idle&&!noE){const w=tt%6;if(w<1.2){const k=Math.min(1,w/.2,(1.2-w)/.2),p=Math.sin(w*16);h.aL.rotation.x=2.7*k;h.aL.rotation.z=-.15*k;h.eL.rotation.x=(.9+.5*p)*k;}}   // fist pump
      if(run&&!noE&&Math.random()<.015)fxE(g.position.x+rnd(-.15,.15),g.position.y+.08,.15,rnd(-.3,.3),rnd(.8,1.4),0,0xffffff,.35);}      // jooton ki chamak
    if(N==='Luna'&&notes)notes.forEach((s,i)=>{const k=(t*.55+i/3)%1;s.position.set(Math.sin(k*6+i*2)*.28,1.95+k*.65,0);s.material.opacity=Math.min(1,(1-k)*1.6);s.scale.setScalar(.16+.1*Math.sin(k*3.14));});   // udte sur

function deckParts(g,len,w,mat,y){const d=new THREE.Mesh(new THREE.BoxGeometry(w,.05,len),mat);d.position.y=y;d.castShadow=true;g.add(d);
  for(const s of[-1,1]){const n=new THREE.Mesh(new THREE.BoxGeometry(w,.05,.25),mat);n.position.set(0,y+.04,s*(len/2+.05));n.rotation.x=-s*.35;g.add(n);}return d;}
function bGlow(w,l,col,op){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,l),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;return m;}
function bBox(w,h,l,mat,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),mat);o.position.set(x,y,z);return o;}

// 5 Magic Carpet — hawa mein lehrata kapda (+15%)
function bk5(){const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const tx=brTex('carpet',256,512,(x,w,h)=>{x.fillStyle='#b3202e';x.fillRect(0,0,w,h);x.strokeStyle='#ffd23f';x.lineWidth=14;x.strokeRect(10,10,w-20,h-20);x.lineWidth=5;x.strokeStyle='#fff3b0';x.strokeRect(34,34,w-68,h-68);
    for(let i=0;i<4;i++){const cy=h*(.16+i*.22);x.fillStyle=i%2?'#ffd23f':'#1d3f8f';x.beginPath();x.moveTo(w/2,cy-44);x.lineTo(w/2+40,cy);x.lineTo(w/2,cy+44);x.lineTo(w/2-40,cy);x.closePath();x.fill();x.fillStyle='#b3202e';x.beginPath();x.arc(w/2,cy,12,0,7);x.fill();}});
  const geo=new THREE.PlaneGeometry(.78,1.55,6,16),cm=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tx,side:THREE.DoubleSide,roughness:.85}));cm.rotation.x=-Math.PI/2;cm.position.y=.14;cm.castShadow=true;body.add(cm);
  const pos=geo.attributes.position,n=pos.count,bx=new Float32Array(n),by=new Float32Array(n);for(let i=0;i<n;i++){bx[i]=pos.getX(i);by[i]=pos.getY(i);}
  const tas=[];for(const s of[-1,1])for(let i=0;i<7;i++){const t=new THREE.Group();t.position.set(-.33+i*.11,.14,s*.78);const c=new THREE.Mesh(new THREE.CylinderGeometry(.012,.02,.14,5),M(0xffd23f,{metalness:.6,roughness:.3}));c.position.y=-.07;t.add(c);body.add(t);tas.push([t,s,i]);}
  const sh=bGlow(.6,1.3,0xffc34d,.18);sh.position.y=.02;g.add(sh);
  g.userData.an=t=>{for(let i=0;i<n;i++){const u=Math.abs(by[i])/.78;pos.setZ(i,Math.sin(t*5+by[i]*5)*.05*(.4+u)+Math.sin(t*3+bx[i]*6)*.02);}pos.needsUpdate=true;geo.computeVertexNormals();
    tas.forEach(a=>{a[0].rotation.x=Math.sin(t*6+a[2])*.5*a[1];});
    body.position.y=.04+Math.sin(t*2.4)*.03;body.rotation.z=Math.sin(t*1.9)*.06;body.rotation.x=Math.sin(t*1.5)*.03;};return g;}

// 8 Thunder Bolt — bijli ke arcs chamakte hain (+30%)
function bk8(){const g=new THREE.Group();
  const tx=brTex('bolt',128,256,(x,w,h)=>{x.fillStyle='#15152b';x.fillRect(0,0,w,h);x.fillStyle='#ffd23f';x.beginPath();x.moveTo(78,10);x.lineTo(30,128);x.lineTo(64,128);x.lineTo(44,246);x.lineTo(104,100);x.lineTo(68,100);x.lineTo(96,10);x.closePath();x.fill();x.strokeStyle='#fff6b0';x.lineWidth=3;x.stroke();});
  deckParts(g,1.4,.42,new THREE.MeshStandardMaterial({map:tx,emissiveMap:tx,emissive:0xffffff,emissiveIntensity:.35,roughness:.4}),.12);
  const wl=[];for(const x of[-.17,.17])for(const z of[-.5,.5]){const w=mkWheel(.075,.07,bm(0x5ad1ff),bm(0xffffff));w.position.set(x,.075,z);g.add(w);wl.push(w);}
  const am=new THREE.LineBasicMaterial({color:0xbfeaff}),arcs=[];
  for(let i=0;i<6;i++){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(24),3));const l=new THREE.Line(geo,am);l.frustumCulled=false;g.add(l);arcs.push(l);}
  const gl=bGlow(.7,1.6,0x4aa8ff,.3);gl.position.y=.02;g.add(gl);let nt=0;
  g.userData.an=t=>{for(const w of wl)w.rotation.x=-t*20;
    if(t>nt){nt=t+.07;for(const l of arcs){const p=l.geometry.attributes.position,sx=(Math.random()<.5?-1:1)*.2,sz=(Math.random()-.5)*1.2,ex=sx*(1+Math.random()*2.6),ey=.15+Math.random()*.55,ez=sz+(Math.random()-.5)*.8;
      for(let k=0;k<8;k++){const u=k/7,j=(k>0&&k<7)?1:0;p.setXYZ(k,sx+(ex-sx)*u+(Math.random()-.5)*.12*j,.13+(ey-.13)*u+(Math.random()-.5)*.1*j,sz+(ez-sz)*u+(Math.random()-.5)*.12*j);}
      p.needsUpdate=true;l.visible=Math.random()>.2;}}
    gl.material.opacity=.15+Math.random()*.35;};return g;}

// ---------- fixed patterns: moving objects ki fixed series (har wave ek pattern follow karti hai) ----------
// har item = [lane, peeche ka offset dz]; S = ek train + gap ki doori
const PATS=[
 S=>[[0,0],[1,S],[2,2*S]],                                    // 0: left -> right sweep
 S=>[[2,0],[1,S],[0,2*S]],                                    // 1: right -> left sweep
 S=>[[0,0],[2,S],[0,2*S],[2,3*S]],                            // 2: zig-zag
 S=>{const l=Math.floor(Math.random()*3);return[[l,0],[l,S],[l,2*S],[l,3*S]];}, // 3: ek lane mein convoy (series)
 S=>[[0,0],[1,0],[1,S+10],[2,S+10]],                          // 4: pair shift
 S=>[[0,0],[2,0],[1,S],[0,2*S],[2,2*S]],                      // 5: checker
 S=>{const a=Math.random()<.5?0:1;return[[a,0],[a+1,0],[a,S],[a+1,S],[a,2*S],[a+1,2*S]];}, // 6: twin wall (do lane saath, ek khali)
 S=>[[0,0],[1,S*.7],[2,S*1.4],[1,S*2.1],[0,S*2.8]],           // 7: lamba diagonal zig-zag (series)
 S=>{const a=Math.random()<.5?0:1;return[[a,0],[a+1,0],[a,S],[a+1,S],[a,2*S],[a+1,2*S],[a,3*S],[a+1,3*S]];}, // 8: lamba twin wall (hard)
];
let rowStatic=[],lastPat=-1,postGate=0; // postGate: gate wali row ke turant baad wali row mein moving train nahi (trap fix)
function spawnWave(){if(postGate)return null;const ok=[0,1,3,4];if(diffLvl>.3)ok.push(6);if(diffLvl>.6)ok.push(2);if(diffLvl>.9)ok.push(5);if(diffLvl>.5)ok.push(7);if(diffLvl>1)ok.push(8); // shuru mein simple, baad mein mushkil patterns
  let pi;do{pi=ok[Math.floor(Math.random()*ok.length)];}while(pi===lastPat&&ok.length>1);
  const L=16+Math.floor(Math.random()*9),dv=(DIFF[SAVE.set.diff]||DIFF[1]).v,v=(9+Math.random()*6+5*Math.min(diffLvl,1.5))*dv,ci=Math.floor(Math.random()*3),items=PATS[pi](L+20);
  for(const it of items)if(!laneOK(it[0],v,-150-it[1]))return null; // lane busy ho to wave skip
  lastPat=pi;let Lt=L;
  for(const it of items){const mv=makeMover(ci,L),x=(it[0]-1)*LANE,zc=-150-mv.Lt/2-it[1];Lt=mv.Lt;mv.m.position.set(x,0,zc);add({t:'train',l:it[0],m:mv.m,L:mv.Lt,z:zc,x,v,H:mv.H,R:0,warn:mv.warn});}
  const used=items.map(i=>i[0]);return{E:Lt+Math.max(...items.map(i=>i[1])),v,free:[0,1,2].filter(l=>!used.includes(l))};}
let lastStatic=false,lastBarLane=-1;
function spawnRow(){rowStatic=[];if(inBonus){bonusRow();return;}
  if(gatePend){const gl=spawnGate();gatePend=false;lastStatic=false; // magic gate ke aas-paas trains: gate wali lane khali, baaki dono lanes mein train
    const ot=[0,1,2].filter(l=>l!==gl).sort(()=>Math.random()-.5);
    let ext=spawnTrain(ot[0],true); // gate ke bagal mein slope wali khadi train
    if(Math.random()<.9)ext=Math.max(ext,spawnTrain(ot[1])); // doosri taraf moving train (ya slope)
    postGate=1;sfx('horn');nextRow=Math.max(90,ext+50);return;}
  const pg=postGate;postGate=0; // gate ke baad wali pehli row: sirf khadi cheezein, moving train nahi
  if(!pg&&Math.random()<.4+.2*Math.min(diffLvl,1.5)){const w=spawnWave();if(w){lastStatic=false;const cl=w.free[Math.floor(Math.random()*w.free.length)];
    if(cl!==undefined&&Math.random()<.85){const st=Math.max(2,Math.min(w.E/12,5));for(let i=0;i<12;i++)addCoin((cl-1)*LANE,1,-150-i*st,0);}
    sfx('horn');spawnPU(w.free,w.E);nextRow=(w.E+(gapB()+rnd(0,10))*(DIFF[SAVE.set.diff]||DIFF[1]).gap)/(1+w.v/Math.max(speed,12));return;}}
  const ls=[0,1,2].sort(()=>Math.random()-.5),dl=Math.min(diffLvl,1.5);let r=Math.random();if(lastStatic)r*=.7; // barrier/bar ke baad hamesha train wali row
  let len=2,free=ls.slice();rowMoved=false;
  const one=(mk,t,l)=>{const m=mk();m.position.set((l-1)*LANE,0,-150);const so={t,l,m,L:.4,z:-150,x:(l-1)*LANE,v:0};add(so);if(t==='barrier')rowStatic.push(so);free=free.filter(f=>f!==l);}; // barriers hamesha khade
  if(r<.7){const n=Math.random()<.45+.2*dl?2:1;for(let i=0;i<n;i++){len=Math.max(len,spawnTrain(ls[i],pg));free=free.filter(f=>f!==ls[i]);}lastStatic=false;}
  else{ // barrier/bar hamesha akela, aur pichli barrier wali lane se alag lane par
    const lanes=[0,1,2].filter(l=>l!==lastBarLane),l=lanes[Math.floor(Math.random()*lanes.length)];
    if(r<.9)one(makeBarrier,'barrier',l);else one(makeBar,'bar',l);lastBarLane=l;lastStatic=true;}
  const cl=free[Math.floor(Math.random()*free.length)];
  if(cl!==undefined&&Math.random()<.85){const n=len>20?10:7,st=Math.max(1.3,len/n);for(let i=0;i<n;i++)addCoin((cl-1)*LANE,1,-150-i*st,0);}
  if(rowMoved)sfx('horn');spawnPU(free,len);nextRow=len+(gapB()+rnd(0,10))*(DIFF[SAVE.set.diff]||DIFF[1]).gap;
}

// asli kutte jaisi awaaz: gale ki buzz (sawtooth) + muh ke formants (ah->on) + shuruaat ki 'bh' phoonk + growl
let dogShape=null;
function dogBarkSfx(v){if(!AC||!sfxOn)return;const t=AC.currentTime,d=v?.27:.17,f=(v?300:390)*(.94+Math.random()*.12);
  if(!dogShape){dogShape=new Float32Array(512);for(let i=0;i<512;i++){const x=i/256-1;dogShape[i]=Math.tanh(x*1.8);}}
  // 1) gale ki awaaz: sawtooth + jitter, pitch pehle thodi upar phir neeche girti hai (asli bhonk ka contour)
  const o=AC.createOscillator(),o2=AC.createOscillator();o.type='sawtooth';o2.type='sawtooth';o2.detune.value=14;
  for(const q of[o,o2]){q.frequency.setValueAtTime(f*.88,t);q.frequency.linearRampToValueAtTime(f*1.12,t+d*.18);q.frequency.exponentialRampToValueAtTime(f*(v?.55:.62),t+d);}
  const jit=AC.createOscillator(),jg=AC.createGain();jit.type='sawtooth';jit.frequency.value=37;jg.gain.value=f*.025;jit.connect(jg);jg.connect(o.frequency);
  const src=AC.createGain();src.gain.value=.5;o.connect(src);o2.connect(src);
  // 2) saans ka shor (kutte ki bhonk mein kaafi noise hoti hai)
  if(!nbuf)noise(.001,.001,1000);
  const ns=AC.createBufferSource();ns.buffer=nbuf;ns.loop=true;const ng=AC.createGain();ng.gain.setValueAtTime(.55,t);ng.gain.exponentialRampToValueAtTime(.18,t+d);ns.connect(ng);ng.connect(src);
  // 3) harshness: halka distortion
  const ws=AC.createWaveShaper();ws.curve=dogShape;ws.oversample='2x';src.connect(ws);
  // 4) muh/gale ke formants (ow/aw jaisi awaaz)
  const am=AC.createGain();am.gain.value=.5;const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=v?70:95;lg.gain.value=.12;lfo.connect(lg);lg.connect(am.gain);
  [[v?760:880,v?520:620,7,1.2],[v?1500:1700,v?1150:1250,8,.9],[2650,2300,6,.45],[3600,3300,5,.18]].forEach(q=>{const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=q[2];bp.frequency.setValueAtTime(q[0],t);bp.frequency.exponentialRampToValueAtTime(q[1],t+d);const g=AC.createGain();g.gain.value=q[3];ws.connect(bp);bp.connect(g);g.connect(am);});
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=180;
  const env=AC.createGain();env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(.5,t+.008);env.gain.exponentialRampToValueAtTime(.32,t+d*.45);env.gain.exponentialRampToValueAtTime(.001,t+d);
  am.connect(hp);hp.connect(env);env.connect(sfxG);
  for(const x of[o,o2,jit,lfo,ns]){x.start(t);x.stop(t+d+.03);}
  // 5) shuruaat ka sharp 'b' click
  noise(.035,.18,2600,t,null,'bandpass');}

// p = daud ka phase, bk = bhonkne ka amount (0..1), barking = true to khada hokar bhonkta hai
function dogPose(D,p,barking,t,run){const L=D.legs;
  if(barking){
    const o=dogOpen(),pul=Math.pow(o,.7);
    for(const l of L){l.p.rotation.x=l.rear?.25:-.35;l.k.rotation.x=l.rear?-.15:.1;}
    D.jaw.rotation.x=-pul*.75;D.tt.visible=pul>.25;D.hd.rotation.x=.18+pul*.22;D.bd.rotation.x=-.06+pul*.05;D.nk.rotation.x=-.75;
    D.bd.position.z=pul*.045;D.g.position.y+=0;D.tail.rotation.y=Math.sin(t*10)*.4;D.tail.rotation.x=-.8;
    D.bd.position.y=-pul*.015;}
  else{
    const A=p*1.6;
    for(const l of L){const ph=A+(l.rear?1.25:0)+l.off*2.2,s=Math.sin(ph),lift=Math.max(0,Math.cos(ph));
      l.p.rotation.x=s*.85;l.k.rotation.x=l.rear?lift*.9:-lift*1.0;}
    D.bd.rotation.x=Math.sin(A*2+.8)*.045;D.bd.position.z=0;D.bd.position.y=Math.abs(Math.sin(A))*.07;D.hd.rotation.x=.55-.6+Math.sin(A*2)*.05;D.nk.rotation.x=-.6;
    const ex=.2+.08*Math.sin(t*9)+dogOpen()*.5;D.jaw.rotation.x=-ex;D.tt.visible=true;D.tail.rotation.y=Math.sin(t*12)*.35;D.tail.rotation.x=-.45;}}

  const n=D.leash.length,len=D.tmpA.distanceTo(D.tmpB),sag=Math.max(.04,.28-len*.12);let prev=D.tmpC.copy(D.tmpA);

        for(const q of[['S',-1],['🔴',0]]){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:colTex(q[0],q[1])}));s.position.set(0,1,-3);tmp.add(s);}

      }else{

        if(!T.bg)T.bg=bgTex(T.sky);
        if(renderer.initTexture){renderer.initTexture(T.bg);if(ROADS[k])renderer.initTexture(ROADS[k]);}
        const G=GROUPS[k];if(G){if(!G.parent){scene.add(G);added=G;}vset(G,true);}

      }

}
