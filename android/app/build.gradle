plugins { id 'com.android.application' }

android {
    namespace 'com.streetrunner3d.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.streetrunner3d.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            // Configure the private release keystore in Android Studio before publishing.
        }
    }
}
